<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="خرائط"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon.png"><meta name="theme-color" content="#0b2a33"><link rel="manifest" href="manifest.json"><title>المعركة</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b2a33;color:#eaf6f8;font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,Arial,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#15505e 0%,#0c3440 55%,#071d25 100%);overflow:hidden}
#stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cn{stroke:rgba(5,20,26,.75);stroke-width:.7;vector-effect:non-scaling-stroke;transition:opacity .4s}
.dim .cn{opacity:.55}.dim .cn.hl{opacity:1}
.cn.a{stroke:#ffd34d;stroke-width:2.4}.cn.d{stroke:#ff5a4d;stroke-width:2.4}
@keyframes fl{0%{filter:brightness(2.6)}100%{filter:none}}.cn.fl{animation:fl .9s ease-out}
.top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start;direction:ltr;pointer-events:none;z-index:5}
.menu{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(8,28,36,.78);color:#fff;font-size:22px;flex:none;display:flex;align-items:center;justify-content:center}
.cards{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;opacity:0;transition:opacity .35s}
.cards.on{opacity:1}
.card{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(8,28,36,.82);border:1px solid rgba(255,255,255,.16);min-width:0}
.card.A{border-color:#ffd34d}.card.Dd{border-color:#ff7a6d}
.card img{width:34px;height:24px;object-fit:cover;border-radius:3px;border:1px solid rgba(255,255,255,.4);flex:none}
.card .r{font-size:10px;letter-spacing:.06em;opacity:.7;text-transform:uppercase}
.card b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{margin-inline-start:auto;font-size:12px;opacity:.85;flex:none;font-variant-numeric:tabular-nums}
.chip{pointer-events:auto;height:44px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(8,28,36,.78);color:#fff;font-size:13px;flex:none;display:flex;align-items:center}
.dice{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 74px);display:flex;justify-content:space-between;padding:0 14px;direction:ltr;pointer-events:none;opacity:0;transition:opacity .3s;z-index:4}
.dice.on{opacity:1}
.side{display:flex;align-items:center;gap:10px}
.dcol{display:flex;flex-direction:column;gap:8px}
.die{width:46px;height:46px;border-radius:10px;background:#f4f4f2;box-shadow:0 3px 0 #b8b8b4,0 6px 14px rgba(0,0,0,.45);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;gap:1px}
.die i{border-radius:50%;background:transparent;margin:auto;width:8px;height:8px}
.die i.p{background:#1b2630}
.die.rl{animation:sh .18s infinite}
@keyframes sh{0%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(7deg) translateY(-4px)}100%{transform:rotate(-8deg) translateY(0)}}
.pts{min-width:74px;padding:8px 10px;border-radius:12px;background:rgba(8,28,36,.86);border:1px solid rgba(255,255,255,.18);text-align:center}
.pts small{display:block;font-size:10px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
.pts b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace}
.pts.win b{color:#6bff9a}.pts.lose b{color:#8b9aa0}
.toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.9);padding:12px 22px;border-radius:14px;background:rgba(8,28,36,.92);border:1px solid rgba(255,255,255,.25);font-size:19px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:6;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bar{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;align-items:center;gap:10px;direction:ltr;z-index:5}
.spd{direction:ltr;height:46px;padding:0 14px;border-radius:14px;background:rgba(8,28,36,.82);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:14px}
.roll{flex:1;height:58px;border-radius:16px;border:0;background:linear-gradient(#ffd34d,#f2b01e);color:#3a2600;font-size:22px;font-weight:800;box-shadow:0 4px 0 #a87400;font-family:inherit}
.roll:disabled{opacity:.45;box-shadow:none}
.roll.pulse:not(:disabled){animation:pl 1.1s infinite}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.rd{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow:auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(rgba(7,29,37,.0),rgba(7,29,37,.96) 28px);z-index:7;display:none}
.rd.on{display:block}
.rd h2{margin:6px 0 10px;text-align:center;font-size:22px}
.rd .row{display:flex;gap:12px;direction:inherit}
.rd .col{flex:1;background:rgba(8,28,36,.85);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 10px;min-width:0}
.rd .col h3{margin:2px 0 6px;font-size:11px;letter-spacing:.08em;opacity:.65;text-transform:uppercase}
.rd .li{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.rd .li img{width:26px;height:18px;object-fit:cover;border-radius:2px;flex:none}
.rd .li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd .li em{font-style:normal;opacity:.8;font-variant-numeric:tabular-nums;font-size:13px}
.rd .nx{display:block;width:100%;margin:12px 0 0;height:54px;border:0;border-radius:14px;background:#ffd34d;color:#3a2600;font-size:20px;font-weight:800;font-family:inherit}
.mn{position:absolute;inset:0;background:rgba(3,14,18,.8);z-index:9;display:none;align-items:center;justify-content:center;padding:20px}
.mn.on{display:flex}
.mn div{background:#0e3440;border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:18px;min-width:min(86vw,320px);display:flex;flex-direction:column;gap:10px;text-align:center}
.mn h2{margin:0 0 6px;font-size:21px}
.mn button{height:50px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:#17596a;color:#fff;font-size:17px;font-family:inherit}
.mn button.pr{background:#ffd34d;color:#3a2600;border:0;font-weight:800}
#ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:20;background:#0b2a33}
@media(max-width:600px){.card b{font-size:12.5px}.card img{width:26px;height:18px}.card .m{font-size:11px}.die{width:38px;height:38px;padding:5px}.die i{width:6px;height:6px}.pts b{font-size:24px}.pts{min-width:62px}.toast{font-size:16px}}
</style></head><body><div id="stage"><div id="ld">…</div></div>
<script src="d3.min.js"></script><script src="topojson-client.min.js"></script><script src="clash.js"></script></body></html>
